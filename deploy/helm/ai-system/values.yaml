replicaCount: 2
image:
  repository: replace-me.dkr.ecr.us-west-2.amazonaws.com/ai-system
  tag: "sha-required"
  pullPolicy: IfNotPresent
serviceAccount:
  create: true
  name: ai-system
  roleArn: ""
service:
  port: 80
  targetPort: 8080
ingress:
  enabled: false
  className: alb
  host: ai.example.internal
config:
  aiProvider: bedrock
  awsRegion: us-west-2
  bedrockModelId: ""
  ollamaBaseUrl: http://localhost:11434
  ollamaModel: llama3.2
  databricksHost: ""
  databricksEndpoint: ""
  databricksTokenSecretName: ""
  databricksTokenSecretKey: token
resources:
  requests: {cpu: 250m, memory: 256Mi}
  limits: {cpu: "1", memory: 1Gi}
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 65
podDisruptionBudget:
  minAvailable: 1
networkPolicy:
  enabled: true
