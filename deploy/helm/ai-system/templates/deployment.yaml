apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-system
  labels: {{- include "ai.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {{- include "ai.labels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "ai.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{name: http, containerPort: 8080}]
          env:
            - {name: AI_PROVIDER, value: {{ .Values.config.aiProvider | quote }}}
            - {name: AWS_REGION, value: {{ .Values.config.awsRegion | quote }}}
            - {name: BEDROCK_MODEL_ID, value: {{ .Values.config.bedrockModelId | quote }}}
            - {name: OLLAMA_BASE_URL, value: {{ .Values.config.ollamaBaseUrl | quote }}}
            - {name: OLLAMA_MODEL, value: {{ .Values.config.ollamaModel | quote }}}
            - {name: DATABRICKS_HOST, value: {{ .Values.config.databricksHost | quote }}}
            - {name: DATABRICKS_ENDPOINT, value: {{ .Values.config.databricksEndpoint | quote }}}
            {{- if .Values.config.databricksTokenSecretName }}
            - name: DATABRICKS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.config.databricksTokenSecretName | quote }}
                  key: {{ .Values.config.databricksTokenSecretKey | quote }}
            {{- else }}
            - {name: DATABRICKS_TOKEN, value: ""}
            {{- end }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe: {httpGet: {path: /readyz, port: http}, initialDelaySeconds: 3, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 10, periodSeconds: 20}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
